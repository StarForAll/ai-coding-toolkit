# Project-scoped Codex defaults for Trellis workflows.
# Codex merges this layer after the user-level config when the project
# is marked as a trusted project. To trust this project, add it under
# `[projects]` in ~/.codex/config.toml, e.g.:
#
#   [projects."/abs/path/to/this/repo"]
#   trust_level = "trusted"
#
# Without trust, Codex skips this project-scoped `.codex/` layer, including
# project-local config, hooks, and rules.

# Keep AGENTS.md as the primary project instruction file.
project_doc_fallback_filenames = ["AGENTS.md"]

# Project rule: when `.trellis/config.yaml` keeps `codex.dispatch_mode =
# "inline"` (the default in this repo), the main Codex session must remain
# inline and must NOT manually spawn subagents. The agent definitions under
# `.codex/agents/` exist for explicit delegated/non-inline paths only; they are
# not an ad hoc escape hatch for inline sessions.

# Codex hooks (`hooks.json` in this directory) are a stable project-local
# carrier when the project `.codex/` layer is trusted. Current official docs
# describe `codex_hooks` as enabled by default, but a higher-precedence user or
# system config can still disable hooks or override hook sources.
# If local behavior seems inconsistent, verify trust state plus the effective
# merged config before treating this repository's hooks as inactive.

# multi_agent_v2 forces structured subagent orchestration with the
# `wait` tool — parent must block on terminal status before acting,
# instead of cancelling / re-spawning. Incompatible with
# [agents].max_threads (codex will reject the combination).
# In this repository, that capability does NOT override the inline-mode rule
# above. Treat it as infrastructure for explicit non-inline/subagent flows, not
# as permission for manual subagent spawning from an inline main session.
# `enabled = true` is required inside the table — the table form does
# NOT auto-enable the feature without it.
# - max_concurrent_threads_per_session: bumps default 4 → 6.
# - min_wait_timeout_ms: 480000 ms = 8 min. Codex default is 10 s, too
#   short for Trellis subagents that routinely take 2-10 min. Hard
#   ceiling is 3,600,000 (1 h).
[features.multi_agent_v2]
enabled = true
max_concurrent_threads_per_session = 6
min_wait_timeout_ms = 480000
